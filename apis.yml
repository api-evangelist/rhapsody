name: Rhapsody
kind: company
description: >-
  Rhapsody Health Solutions is a US-headquartered (Boston, Massachusetts)
  healthcare interoperability company trusted by more than 1,900 healthcare
  organizations across 31 countries, and recognized as Best in KLAS for
  integration engines for 17 consecutive years. Formed from the lineage of
  Orion Health's Rhapsody Integration Engine (2000), the 2019 merger with
  Corepoint Health, and acquisitions of Datica, NextGate EMPI, and CareCom,
  Rhapsody delivers a single interoperability platform spanning integration
  engines (Rhapsody and Corepoint), enterprise master patient index (EMPI /
  Rhapsody Identity), semantic terminology management, data governance
  (Guardian), and automated integrations (Envoy, Image Director). The platform
  supports FHIR, HL7 v2, REST, CDA, X12/EDI, SQL, DICOM, AMQP, and Model
  Context Protocol (MCP) from a single deployment, with embedded AI (Rhapsody
  Axon). Its home market is the United States, aligned to ONC/CMS interoperability
  mandates. Rhapsody's product REST/administration and FHIR APIs are documented
  in a developer documentation portal (docs.rhapsody.health) that sits behind an
  AWS Cognito single-sign-on gate; there is no public self-serve API host or
  downloadable specification.
