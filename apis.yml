- aid: rhapsody:rhapsody-guardian
  name: Rhapsody Guardian (Healthcare API Gateway)
  description: >-
    Rhapsody Guardian is a healthcare-purpose-built API gateway, launched October
    2025, that lets healthcare organizations securely expose their own APIs and
    FHIR endpoints. Rhapsody states Guardian "supports OAuth 2.0, SMART on FHIR,
    and Basic Auth" out of the box, and adds rate limiting, allow/block rules,
    audit-ready logging and real-time audit trails, plus gateway monitoring,
    transaction logs, deployment logs and graphical metrics. It manages APIs and
    HL7 from the same platform as the Rhapsody and Corepoint engines. Guardian's
    own management/API reference is documented in the gated developer portal.
  humanURL: https://rhapsody.health/solutions/guardian/
  tags:
  - API Gateway
  - FHIR
  - SMART on FHIR
  - API Security
  - Interoperability
  properties:
  - type: Documentation
    url: https://rhapsody.health/solutions/guardian/
  - type: APIReference
    url: https://docs.rhapsody.health/
- aid: rhapsody:rhapsody-axon-mcp
  name: Rhapsody Axon (AI + MCP)
  description: >-
    Rhapsody Axon embeds AI into the integration platform and adds Model Context
    Protocol (MCP) support for AI-driven, agent-ready healthcare data workflows.
    Capabilities are documented in the gated developer portal.
