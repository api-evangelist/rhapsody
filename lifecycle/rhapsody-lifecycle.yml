note: >-
  Rhapsody ships versioned, customer-installed products (integration engines,
  EMPI, terminology) rather than a single hosted public API, so its lifecycle is
  a PRODUCT release lifecycle, not an API version train. What is publicly
  observable: named major.minor product releases announced on the corporate blog
  (Rhapsody Integration 7.3, Corepoint 7.5.3, Rhapsody Semantic 15.3), a support
  portal, and nothing else. There is NO public status page, NO published
  deprecation or sunset policy, NO SLA document and NO end-of-life matrix — those
  live with the customer agreement and inside the gated documentation portal.
