note: >-
  Rhapsody markets MCP (Model Context Protocol) support as a PLATFORM CAPABILITY
  of its integration engines — "Rhapsody supports APIs and Interfaces for FHIR,
  HL7 v2, MCP, REST, CDA, X12/EDI, SQL, DICOM, and AMQP from a single platform...
  Model Context Protocol (MCP) support is included for organizations exploring
  more automated, AI-driven workflows" — but publishes NO MCP server an agent can
  reach. There is no hosted endpoint, no stdio package on any registry, no
  install command, and no configuration example on any public page. MCP here is
  something a Rhapsody CUSTOMER stands up inside its own engine deployment, per
  instance, behind that customer's own network and identity. Because nothing is
  reachable and nothing is installable, NO `MCPServer` pointer is emitted into
  apis.yml: a pointer would credit Rhapsody with an agent surface no agent can
  call. No tool list is derived either — there is no public OpenAPI to derive one
  from, and inventing an endpoint or a tool set would be fabrication.
