actions:
  openapiHarvested: false
  specsSaved: 0
  reason: |
    No anonymously reachable specification, FHIR CapabilityStatement, or
    SMART-on-FHIR configuration exists. The developer documentation portal is
    fully gated behind AWS Cognito, and the integration engines are deployed in
    customer environments with no single public API host. The profile catalogs
    the real, publicly-described product API family (Rhapsody Integration
    Engine, Corepoint, Rhapsody Identity/EMPI, Rhapsody Semantic, Rhapsody Axon)
    with links to public product pages and the gated developer portal. Nothing
    behind the gate was fabricated.
